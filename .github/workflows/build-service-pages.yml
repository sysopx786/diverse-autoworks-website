name: Build and publish bilingual service pages

on:
  push:
    branches: [main]
    paths:
      - "tools/service_pages.py"
      - "tools/build.py"
      - "docs/assets/css/main.css"
      - "docs/assets/js/main.js"
      - "docs/assets/img/classic-autoworks.webp"
      - "docs/assets/img/classic-*.webp"
      - "docs/assets/img/trailer-*.webp"
      - "tools/trailer_page.py"
      - "tools/service_pages_batch*.py"
      - ".github/workflows/build-service-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-service-pages-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check service keys and translations
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from service_pages import SERVICE_PAGES
          from pathlib import Path
          keys, slugs, covers = set(), set(), set()
          expected = {"svc_engine", "svc_battery", "svc_transmission", "svc_steering", "svc_fuel", "svc_rust", "svc_prepurchase", "svc_hybrid", "svc_classic"}
          assert expected.issubset({p["key"] for p in SERVICE_PAGES})
          for p in SERVICE_PAGES:
              assert p["key"] not in keys, p["key"]
              assert p["slug"] not in slugs, p["slug"]
              assert not covers.intersection(p.get("covers", [])), p["key"]
              keys.add(p["key"])
              slugs.add(p["slug"])
              covers.update(p.get("covers", []))
              assert 5 <= len(p["faq"]) <= 8, p["key"]
              for f, limit in (("title", 60), ("desc", 160)):
                  assert all(len(p["page"][f][lang]) <= limit for lang in ("en", "es")), (p["key"], f)
          print(f"PASS: {len(keys)} distinct bilingual service pages")
          PY
      - name: Build production pages
        env:
          SITE_URL: https://mydiverseauto.com
        run: python tools/build.py
      - name: Verify generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          slugs = ["engine-repair", "battery-replacement", "transmission-repair", "steering-components",
                   "fuel-system-gas-tank", "rust-corrosion-control", "pre-purchase-inspection", "hybrid-ev-service", "classic-car-repair", "trailer-repair"]
          for slug in slugs:
              for prefix in ("", "es/"):
                  path = Path("docs") / prefix / slug / "index.html"
                  assert path.is_file(), f"Missing {path}"
                  html = path.read_text(encoding="utf-8")
                  assert 'rel="canonical"' in html, f"Missing canonical: {path}"
                  assert 'hreflang="es"' in html, f"Missing hreflang: {path}"
          xml = Path("docs/sitemap.xml").read_text(encoding="utf-8")
          ET.fromstring(xml)
          for slug in slugs:
              assert f"https://mydiverseauto.com/{slug}/" in xml, slug
              assert f"https://mydiverseauto.com/es/{slug}/" in xml, slug
          print(f"PASS: {len(slugs) * 2} EN/ES page outputs and sitemap")
          PY
      - name: Verify home classic car feature
        run: |
          python - <<'PY'
          from pathlib import Path
          for prefix, label in (("", "Keeping Legends on the Road"), ("es/", "Clásicos que siguen rodando")):
              page = Path("docs") / prefix / "index.html"
              html = page.read_text(encoding="utf-8")
              assert 'id="classic-cars"' in html, f"Missing classic section: {page}"
              assert "classic-autoworks.webp" in html, f"Missing image: {page}"
              assert label in html, f"Missing headline: {page}"
              assert "classic-car-repair/" in html, f"Missing service link: {page}"
          assert Path("docs/assets/img/classic-autoworks.webp").stat().st_size > 30_000
          print("PASS: English and Spanish classic car home feature")
          PY
      - name: Verify classic car gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          images = [
              "classic-red-convertible.webp",
              "classic-truck-and-sedan.webp",
              "classic-blue-truck.webp",
          ]
          for prefix in ("", "es/"):
              path = Path("docs") / prefix / "classic-car-repair/index.html"
              html = path.read_text(encoding="utf-8")
              assert 'id="classic-gallery"' in html, path
              assert html.count('class="classic-gallery-card"') == 3, path
              for name in images:
                  assert name in html, (path, name)
                  assert (Path("docs/assets/img") / name).stat().st_size > 10_000
          print("PASS: all 3 gallery images on English and Spanish pages")
          PY
      - name: Verify bilingual Classic Cars and Fleet Repair navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          from urllib.parse import urljoin, urlparse
          import re
          for prefix, classic, fleet in (
              ("", "Classic Cars", "Fleet Repair"),
              ("es/", "Autos clásicos", "Reparación de flotas"),
          ):
              for slug in ("", "classic-car-repair/", "fleet-repairs/"):
                  path = Path("docs") / prefix / slug / "index.html"
                  html = path.read_text(encoding="utf-8")
                  nav = html.split('id="site-nav"', 1)[1].split("</nav>", 1)[0]
                  anchors = re.findall(r'<a\b[^>]*href="([^"]+)"[^>]*>(.*?)</a>', nav, re.S)
                  labels = {
                      unescape(re.sub(r"<[^>]+>", "", label)).strip(): href
                      for href, label in anchors
                  }
                  base = f"https://mydiverseauto.com/{prefix}{slug}"
                  for label, target in (
                      (classic, f"/{prefix}classic-car-repair/"),
                      (fleet, f"/{prefix}fleet-repairs/"),
                  ):
                      assert label in labels, (path, label)
                      actual = urlparse(urljoin(base, labels[label])).path
                      assert actual == target, (path, label, actual, target)
          print("PASS: bilingual navigation on home, Classic Cars and Fleet Repair")
          PY
      - name: Check Spanish content
        run: python tests/es_audit.py
      - name: Verify FormSubmit request integration
        run: |
          node --check docs/assets/js/main.js
          python - <<'PY'
          from pathlib import Path
          for prefix in ("", "es/"):
              for slug in ("contact", "fleet-repairs"):
                  page = Path("docs") / prefix / slug / "index.html"
                  text = page.read_text(encoding="utf-8")
                  assert 'data-endpoint="https://formsubmit.co/ajax/Diverseautoworks@verizon.net"' in text, page
                  assert 'method="POST"' in text, page
                  assert 'name="_honey"' in text, page
                  assert 'name="company_site"' not in text, page
                  assert "Prepare email request" not in text, page
                  assert "This opens your email app" not in text, page
          script = Path("docs/assets/js/main.js").read_text(encoding="utf-8")
          assert 'String(data.success).toLowerCase() !== "true"' in script
          assert 'body: JSON.stringify(body)' in script
          print("PASS: bilingual forms, FormSubmit endpoint and safe response handling")
          PY
      - name: Commit and push generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tools/lastmod.json
          if ! git diff --cached --quiet; then
            git commit -m "Build eight bilingual service pages and refresh sitemap"
            git push origin HEAD:main
          else
            echo "Generated pages already up to date."
          fi
